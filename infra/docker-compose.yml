# Local/single-host edge. Ports: infra/docs/ports.md. The backend runs on the host (make backend); nginx reaches it via host.docker.internal.
name: wealth-advisor

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${PROXY_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; Docker Desktop provides it already
    restart: unless-stopped
